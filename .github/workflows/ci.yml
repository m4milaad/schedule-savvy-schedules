name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npx vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

  edge-functions:
    name: Edge functions — type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The repo has a package.json; without this Deno looks for the npm imports in node_modules.
      - run: deno check --node-modules-dir=auto supabase/functions/send-push/index.ts

  python:
    name: Python — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The tests need only the API layer; the full requirements pull in torch (several GB).
      - name: Install dependencies
        run: pip install fastapi==0.116.1 httpx==0.28.1 numpy==2.3.2 python-dotenv==1.0.1 slowapi==0.1.9 pytest pytest-asyncio pytest-cov

      # From the repo root, so `import backend` works.
      - name: Pytest
        run: python -m pytest backend/tests -v --cov=backend --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

# NOTE: To gate Vercel deploys on CI passing, add these jobs as
# "Required status checks" in GitHub → Settings → Branches → main → Protection rules.
