apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def signingProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    def text = keystorePropsFile.getText('UTF-8')
    if (text.startsWith('\uFEFF')) {
        text = text.substring(1)
    }
    signingProps.load(new StringReader(text))
}

def getSigningValue = { String key ->
    def envValue = System.getenv(key)
    if (envValue != null && !envValue.trim().isEmpty()) return envValue.trim()
    def propValue = signingProps.getProperty(key)
    return propValue != null ? propValue.trim() : null
}

android {
    namespace "com.cukacadex.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cukacadex.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "6.6.8"
    }
    androidResources {
        // The default pattern also drops files starting with "_", which the web build can emit.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        release {
            def storeFilePath = getSigningValue('RELEASE_STORE_FILE')
            def storePass = getSigningValue('RELEASE_STORE_PASSWORD')
            def keyAliasValue = getSigningValue('RELEASE_KEY_ALIAS')
            def keyPass = getSigningValue('RELEASE_KEY_PASSWORD')

            if (storeFilePath) {
                storeFile file(storeFilePath)
            }
            if (storePass) {
                storePassword storePass
            }
            if (keyAliasValue) {
                keyAlias keyAliasValue
            }
            if (keyPass) {
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation "com.google.firebase:firebase-messaging"
    testImplementation "junit:junit:4.13.2"
}

// Push needs the Firebase project's config; without it the app builds and runs, just without push.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("android/app/google-services.json is missing: push notifications are disabled in this build.")
}
